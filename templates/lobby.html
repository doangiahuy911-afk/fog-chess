<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暗殺霧チェス - ロビー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .box { background-color: #34495e; padding: 25px 15px; margin: 10px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 90%; max-width: 350px; box-sizing: border-box; }
        input { padding: 12px; font-size: 16px; border-radius: 5px; border: none; width: 90%; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
        .btn-create { background-color: #3498db; width: 95%; color: white;}
        .btn-join { background-color: #9b59b6; width: 95%; color: white;}
        hr { border: 0; height: 1px; background: #5d6d7e; margin: 20px 0; }
        .ai-buttons-container { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .top-bar-buttons { display: flex; justify-content: flex-end; padding: 10px; max-width: 350px; margin: 0 auto; }
        .icon-btn { background: rgba(0,0,0,0.2); color: var(--text-color); padding: 8px 12px; font-size: 14px; border-radius: 5px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar-buttons">
        <button class="icon-btn" onclick="cycleLanguage()">🌐 <span id="lang-label">日本語</span></button>
    </div>

    <h1 data-i18n="lobby_title">🌫️ 暗殺霧チェス ロビー</h1>
    <button class="btn-rules" onclick="location.href='/room/AI_1_rules'" style="max-width: 350px; background-color: #2ecc71;" data-i18n="btn_test">♟️ 試しにゲーム画面を見てみる</button>

    <div class="box">
        <h3 style="margin-top: 0;" data-i18n="create_room">🔑 新しく部屋を作る</h3>
        <p style="color: #bdc3c7; font-size: 12px; margin-bottom: 5px;" data-i18n="room_pwd_desc">友達に送るパスワード</p>
        <input type="text" id="generated-id" value="{{ suggested_id }}" readonly style="background-color: #2c3e50; color: #f1c40f; font-weight: bold;">
        <button class="btn-create" onclick="createRoom()" data-i18n="btn_create">部屋を作る</button>

        <hr>

        <h3 style="margin-top: 0;" data-i18n="join_room">🚪 既存の部屋に入る</h3>
        <input type="text" id="room-input" placeholder="パスワードを入力" data-i18n-placeholder="pwd_placeholder" onkeydown="if(event.key==='Enter')joinRoom()">
        <button class="btn-join" onclick="joinRoom()" data-i18n="btn_join">合流する</button>

        <hr>

        <h3 style="margin-top: 0;" data-i18n="play_ai">🤖 1人で遊ぶ (CPU戦)</h3>
        <p style="color: #bdc3c7; font-size: 12px; margin-bottom: 10px;" data-i18n="ai_desc">相手の強さを選んでください</p>
        
        <div class="ai-buttons-container">
            <button class="btn-ai-1" onclick="playAI(1)" data-i18n="ai_1">🟢 Lv.1 接待プレイ（練習用）</button>
            <button class="btn-ai-2" onclick="playAI(2)" data-i18n="ai_2">🟠 Lv.2 熱源探知（通常）</button>
            <button class="btn-ai-3" onclick="playAI(3)" data-i18n="ai_3">🔴 Lv.3 未来予知（ガチ勢向け）</button>
        </div>
    </div>

    <script>
        // 多言語辞書
        const dictLobby = {
            ja: {
                lobby_title: "🌫️ 暗殺霧チェス ロビー", btn_test: "♟️ 試しにゲーム画面を見てみる",
                create_room: "🔑 新しく部屋を作る", room_pwd_desc: "友達に送るパスワード", btn_create: "部屋を作る",
                join_room: "🚪 既存の部屋に入る", pwd_placeholder: "パスワードを入力", btn_join: "合流する",
                play_ai: "🤖 1人で遊ぶ (CPU戦)", ai_desc: "相手の強さを選んでください",
                ai_1: "🟢 Lv.1 接待プレイ（練習用）", ai_2: "🟠 Lv.2 熱源探知（通常）", ai_3: "🔴 Lv.3 未来予知（ガチ勢向け）"
            },
            en: {
                lobby_title: "🌫️ Fog Chess Lobby", btn_test: "♟️ Test the Game Screen",
                create_room: "🔑 Create New Room", room_pwd_desc: "Password to share with a friend", btn_create: "Create Room",
                join_room: "🚪 Join Existing Room", pwd_placeholder: "Enter Password", btn_join: "Join Room",
                play_ai: "🤖 Play vs AI", ai_desc: "Select AI Difficulty",
                ai_1: "🟢 Lv.1 Easy (Practice)", ai_2: "🟠 Lv.2 Heat Tracker (Normal)", ai_3: "🔴 Lv.3 Oracle (Hardcore)"
            },
            zh: {
                lobby_title: "🌫️ 迷雾象棋 大厅", btn_test: "♟️ 测试游戏画面",
                create_room: "🔑 创建新房间", room_pwd_desc: "发送给朋友的密码", btn_create: "创建房间",
                join_room: "🚪 加入已有房间", pwd_placeholder: "输入密码", btn_join: "加入房间",
                play_ai: "🤖 单人游戏 (对战AI)", ai_desc: "请选择AI难度",
                ai_1: "🟢 Lv.1 简单 (练习)", ai_2: "🟠 Lv.2 热源探测 (普通)", ai_3: "🔴 Lv.3 未来预测 (困难)"
            }
        };

        const langs = ['ja', 'en', 'zh'];
        const langLabels = ['日本語', 'English', '中文'];
        let currentLangIdx = parseInt(localStorage.getItem('chess_lang_idx') || '0');

        function applyLang() {
            const t = dictLobby[langs[currentLangIdx]];
            document.getElementById('lang-label').innerText = langLabels[currentLangIdx];
            localStorage.setItem('chess_lang_idx', currentLangIdx); // 設定を保存
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
        }

        function cycleLanguage() {
            currentLangIdx = (currentLangIdx + 1) % langs.length;
            applyLang();
        }

        function createRoom() { location.href = '/room/' + encodeURIComponent(document.getElementById('generated-id').value); }
        function joinRoom() {
            const roomId = document.getElementById('room-input').value.trim();
            if (roomId) location.href = '/room/' + encodeURIComponent(roomId);
            else alert('パスワードを入力してください / Please enter a password');
        }
        function playAI(level) { 
            location.href = '/room/AI_' + level + '_' + Math.random().toString(36).substr(2, 6); 
        }

        // ロビー起動時に言語設定を適用
        document.addEventListener('DOMContentLoaded', applyLang);
    </script>
</body>
</html>
