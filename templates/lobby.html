<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="視界が1マスしかない極限の心理戦！ブラウザで無料で遊べるオンライン『暗殺霧チェス』。">
    <title>暗殺霧チェス - ロビー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .box { background-color: #34495e; padding: 25px 15px; margin: 10px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 90%; max-width: 350px; box-sizing: border-box; }
        input { padding: 12px; font-size: 16px; border-radius: 5px; border: none; width: 90%; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
        .btn-create { background-color: #3498db; width: 95%; color: white;}
        .btn-join { background-color: #9b59b6; width: 95%; color: white;}
        hr { border: 0; height: 1px; background: #5d6d7e; margin: 20px 0; }
        .ai-buttons-container { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    </style>
</head>
<body>

    <div id="rules-modal" class="switch-overlay" style="display: none;">
        <div class="switch-box" style="padding: 20px; text-align: left; color: #ecf0f1;">
            <h3 style="color: #f1c40f; text-align: center; margin-top: 0;">📜 暗殺霧チェスのルール</h3>
            <ul style="padding-left: 20px; font-size: 14px;">
                <li><strong>勝利条件:</strong> 相手のキングを取る</li>
                <li><strong>視界:</strong> 自分の駒とその正面1マスのみ</li>
                <li><strong>ソナー:</strong> 攻撃範囲に敵がいると「⚠️」</li>
                <li><strong>通知:</strong> 相手が動かした駒の種類がわかる</li>
                <li><strong>タイムリミット:</strong> 5ターン周期でキングが公開される</li>
                <li><strong>暗殺予告:</strong> 自分のキングが狙われると警告が出る</li>
            </ul>
            <div style="text-align: center; margin-top: 20px;">
                <button class="ready-btn" onclick="closeRules()" style="background-color: #e74c3c;">閉じる</button>
            </div>
        </div>
    </div>

    <h1>🌫️ 暗殺霧チェス ロビー</h1>
    <button class="btn-rules" onclick="openRules()" style="max-width: 350px;">📖 ルールを確認する</button>

    <div class="box">
        <h3 style="margin-top: 0;">🔑 新しく部屋を作る</h3>
        <p style="color: #bdc3c7; font-size: 12px; margin-bottom: 5px;">友達に送るパスワード</p>
        <input type="text" id="generated-id" value="{{ suggested_id }}" readonly style="background-color: #2c3e50; color: #f1c40f; font-weight: bold;">
        <button class="btn-create" onclick="createRoom()">部屋を作る</button>

        <hr>

        <h3 style="margin-top: 0;">🚪 既存の部屋に入る</h3>
        <input type="text" id="room-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')joinRoom()">
        <button class="btn-join" onclick="joinRoom()">合流する</button>

        <hr>

        <h3 style="margin-top: 0;">🤖 1人で遊ぶ (CPU戦)</h3>
        <p style="color: #bdc3c7; font-size: 12px; margin-bottom: 10px;">相手の強さを選んでください</p>
        
        <!-- 🌟 難易度選択ボタン -->
        <div class="ai-buttons-container">
            <button class="btn-ai-1" onclick="playAI(1)">🟢 Lv.1 接待プレイ（練習用）</button>
            <button class="btn-ai-2" onclick="playAI(2)">🟠 Lv.2 熱源探知（通常）</button>
            <button class="btn-ai-3" onclick="playAI(3)">🔴 Lv.3 未来予知（ガチ勢向け）</button>
        </div>
    </div>

    <script>
        function openRules() { document.getElementById('rules-modal').style.display = 'flex'; }
        function closeRules() { document.getElementById('rules-modal').style.display = 'none'; }
        function createRoom() { location.href = '/room/' + encodeURIComponent(document.getElementById('generated-id').value); }
        function joinRoom() {
            const roomId = document.getElementById('room-input').value.trim();
            if (roomId) location.href = '/room/' + encodeURIComponent(roomId);
            else alert('パスワードを入力してください！');
        }
        function playAI(level) { 
            // 🌟 URLの部屋名に「_1_」などを仕込んで、サーバー側でレベルを判定させる
            location.href = '/room/AI_' + level + '_' + Math.random().toString(36).substr(2, 6); 
        }
    </script>
</body>
</html>
